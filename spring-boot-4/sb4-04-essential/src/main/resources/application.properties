spring.application.name=jobportal
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# 1. 메모리 기반 H2 일 경우 아래 2줄 사용
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.sql.init.mode=embedded
# 2. 파일 기반 H2 일 경우 ① 처음에는 아래 2줄 사용 ② 그 다음에는 spring.sql.init.mode=always 라인 주석처리 (데이터가 다시 INSERT 되는 것을 막기 위해)
spring.datasource.url=jdbc:h2:file:Z:\\lab_ext\\05-java-spring\\spring-project\\spring-boot-4\\jobportal;AUTO_SERVER=true
#spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:sql/jobportal-schema.sql
spring.sql.init.data-locations=classpath:sql/jobportal-data.sql
# 만약 파일이 제공되지 않은 상태로 시스템을 구동할 경우 아래와 같이 optional 사용
#spring.sql.init.data-locations=optional:classpath:sql/jobportal-data.sql

